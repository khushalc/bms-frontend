<section class="page">
  <div class="card">
    <h1>Reset password</h1>

    @if (!hasToken()) {
      <p class="error">This link is missing its reset token. Ask for a new link.</p>
      <a routerLink="/login" class="btn btn--ghost">Back to sign in</a>
    } @else if (success()) {
      <p class="success">✅ Password updated. Redirecting to sign in…</p>
    } @else {
      <p class="muted small">Enter a new password for your account.</p>
      <form [formGroup]="form" (ngSubmit)="submit()">
        <fieldset class="fields" [disabled]="saving()">
          <label class="field">
            <span>New password (min 8)</span>
            <input type="password" formControlName="new_password" autocomplete="new-password" minlength="8" />
          </label>
          <label class="field">
            <span>Confirm new password</span>
            <input type="password" formControlName="confirm_password" autocomplete="new-password" />
            @if (form.errors?.['mismatch'] && form.controls.confirm_password.dirty) {
              <small class="error">Passwords don't match.</small>
            }
          </label>
        </fieldset>

        @if (error()) { <p class="error">{{ error() }}</p> }

        <div class="actions">
          <button type="submit" class="btn btn--primary" [disabled]="form.invalid || saving()">
            {{ saving() ? 'Saving…' : 'Set new password' }}
          </button>
        </div>
      </form>
    }
  </div>
</section>
