<section class="page">
  <header class="page__head">
    <div>
      <a routerLink="/buildings" class="back">← Back to buildings</a>
      <h1>{{ id() ? 'Edit' : 'New' }} building</h1>
    </div>
    <a routerLink="/buildings" class="btn btn--ghost">Cancel</a>
  </header>

  @if (loading()) {
    <p class="muted">Loading…</p>
  } @else {
    <form [formGroup]="form" (ngSubmit)="submit()" class="stack">
      <label class="field">
        <span>Name</span>
        <input type="text" formControlName="name" />
      </label>
      <label class="field">
        <span>Building number</span>
        <input type="text" formControlName="number" placeholder="e.g. A, B1, Tower-2" />
      </label>
      <label class="field">
        <span>Address</span>
        <textarea formControlName="address" rows="2"></textarea>
      </label>
      <div class="row">
        <label class="field">
          <span>Floor count</span>
          <input type="number" formControlName="floor_count" min="1" max="200" />
        </label>
        <label class="field">
          <span>Number of flats <small class="muted">(planned)</small></span>
          <input type="number" formControlName="declared_flat_count" min="0" max="10000" />
        </label>
      </div>

      <label class="field">
        <span>GST number <small class="muted">(optional)</small></span>
        <input type="text" formControlName="gst_number" placeholder="e.g. 27ABCDE1234F1Z5" />
      </label>
      <label class="field">
        <span>Mahada / BMC registration number <small class="muted">(optional)</small></span>
        <input type="text" formControlName="mahada_bmc_registration_number" />
      </label>

      <fieldset class="amenities">
        <legend>Amenities</legend>
        <label class="checkbox">
          <input type="checkbox" formControlName="has_gym" />
          <span>Gym</span>
        </label>
        <label class="checkbox">
          <input type="checkbox" formControlName="has_swimming_pool" />
          <span>Swimming pool</span>
        </label>
      </fieldset>

      @if (error()) { <p class="error">{{ error() }}</p> }

      <div class="actions">
        <button type="submit" class="btn btn--primary" [disabled]="form.invalid || saving()">
          {{ saving() ? 'Saving…' : 'Save' }}
        </button>
      </div>
    </form>
  }
</section>
