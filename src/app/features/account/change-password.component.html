<section class="page">
  <header class="page__head">
    <div>
      <a routerLink="/" class="back">← Back to dashboard</a>
      <h1>Change password</h1>
    </div>
  </header>

  <form [formGroup]="form" (ngSubmit)="submit()" class="stack">
    <fieldset class="fields" [disabled]="saving()">
      <label class="field">
        <span>Current password</span>
        <input type="password" formControlName="current_password" autocomplete="current-password" />
      </label>
      <label class="field">
        <span>New password (min 8)</span>
        <input type="password" formControlName="new_password" autocomplete="new-password" minlength="8" />
      </label>
      <label class="field">
        <span>Confirm new password</span>
        <input type="password" formControlName="confirm_password" autocomplete="new-password" />
        @if (form.errors?.['mismatch'] && form.controls.confirm_password.dirty) {
          <small class="error">Passwords don't match.</small>
        }
      </label>
    </fieldset>

    @if (error()) { <p class="error">{{ error() }}</p> }
    @if (success()) { <p class="success">Password changed. Next login will use your new password.</p> }

    <div class="actions">
      <button type="submit" class="btn btn--primary" [disabled]="form.invalid || saving()">
        {{ saving() ? 'Saving…' : 'Change password' }}
      </button>
    </div>
  </form>
</section>
